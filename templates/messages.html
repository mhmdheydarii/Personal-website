{% if messages %}
{% for message in messages %}

<div class="popup-alert">
    {{ message }}
</div>

<style>
.popup-alert{
    position: fixed;
    top:20px;
    right:20px;
    background:#16a34a;
    color:white;
    padding:16px 24px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
    animation: fadein .3s ease;
}

@keyframes fadein{
    from{
        opacity:0;
        transform:translateY(-20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}
</style>

<script>
setTimeout(()=>{
    document.querySelector('.popup-alert')?.remove()
},3000)
</script>

{% endfor %}
{% endif %}
